name: Production QA

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Fast Cloudflare Pages deploy"
      - "Actress alias merge deploy"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-qa
  cancel-in-progress: true

jobs:
  qa:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Cloudflare propagation
        run: sleep 30

      - name: Run production QA with propagation retries
        run: |
          for attempt in 1 2 3; do
            echo "Production QA attempt ${attempt}/3"
            if python scripts/qa_production.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Production may still be propagating; waiting 30 seconds before retry."
              sleep 30
            fi
          done
          echo "Production QA failed after 3 attempts."
          exit 1
