name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bootstrap site source from current Pages deployment
        if: ${{ hashFiles('public/index.html') == '' }}
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          import re

          BASE = 'https://okazu-yoridori-midori.pages.dev'
          UA = {'User-Agent': 'Mozilla/5.0 GitHub-Actions-Site-Migration/1.0'}
          root = Path('public')
          root.mkdir(parents=True, exist_ok=True)

          def get(url):
              req = Request(url, headers=UA)
              with urlopen(req, timeout=30) as r:
                  return r.read()

          sitemap = get(BASE + '/sitemap.xml')
          (root / 'sitemap.xml').write_bytes(sitemap)
          xml = sitemap.decode('utf-8', 'replace')
          urls = re.findall(r'<loc>(.*?)</loc>', xml)

          for url in urls:
              path = urlparse(url).path
              if path == '/':
                  dest = root / 'index.html'
              elif path.endswith('/'):
                  dest = root / path.lstrip('/') / 'index.html'
              else:
                  dest = root / path.lstrip('/')
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(get(url))

          extras = [
              '/404.html', '/robots.txt', '/ga4-check.html',
              '/google11014fc80b2a37f0.html',
              '/assets/style.css', '/assets/style-white-v2.css',
              '/assets/favicon.png', '/assets/og-default.png', '/assets/logo-512.png',
              '/assets/affiliate-config.js', '/assets/affiliate-compliance.js',
              '/assets/app.js', '/assets/v6.js', '/assets/ga4-config.js', '/assets/ga4.js'
          ]
          for path in extras:
              try:
                  dest = root / path.lstrip('/')
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(get(BASE + path))
              except Exception as e:
                  print('optional fetch failed:', path, e)

          headers = '''/*
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
            X-Frame-Options: SAMEORIGIN
            Permissions-Policy: camera=(), microphone=(), geolocation=()

          /assets/*
            Cache-Control: public, max-age=86400
          '''
          (root / '_headers').write_text(headers, encoding='utf-8')
          PY

      - name: Normalize approved affiliate status and routes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('public')
          approved = '当サイトはDMMアフィリエイトに参加しています。成果報酬リンクを掲載する場合は、広告・PRであることが分かるよう表示します。'
          replacements = {
              '当サイトはアフィリエイトプログラムへの参加を予定しています。審査通過後、広告・成果報酬リンクを掲載する場合は分かるように表示します。': approved,
              'DMMアフィリエイト審査中です。承認後に成果報酬リンクを掲載する場合は、広告であることが分かるよう表示します。': approved,
              '当サイトはDMMアフィリエイトへ申請中です。承認後に成果報酬型広告を掲載する場合は、広告・PRであることが読者に分かるよう表示します。': '当サイトはDMMアフィリエイトに参加しています。成果報酬型広告を掲載する場合は、広告・PRであることが読者に分かるよう表示します。',
              '当サイトはDMMアフィリエイトへ申請中です。承認後に成果報酬リンクを掲載する場合は、広告であることが分かるよう表示します。': approved,
              '承認後の商品導線': '広告・商品導線'
          }

          targets = list(root.rglob('*.html'))
          for extra in (root / 'about', root / 'privacy'):
              if extra.exists():
                  targets.append(extra)

          seen = set()
          for p in targets:
              if p in seen:
                  continue
              seen.add(p)
              s = p.read_text(encoding='utf-8', errors='replace')
              for old, new in replacements.items():
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          if (root / 'about').exists():
              shutil.copyfile(root / 'about', root / 'about.html')
          if (root / 'privacy').exists():
              shutil.copyfile(root / 'privacy', root / 'privacy.html')

          (root / 'assets' / 'affiliate-config.js').write_text(
              'window.AFFILIATE_CONFIG = {\n'
              '  approved: true,\n'
              '  affiliateId: "okazumidori-001",\n'
              '  apiId: "",\n'
              '  note: "DMMアフィリエイト審査承認済み。API IDは未設定です。"\n'
              '};\n',
              encoding='utf-8'
          )
          PY

      - name: Save site source to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if ! git diff --cached --quiet; then
            git commit -m "Sync Pages site source [skip ci]"
            git push
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=okazu-yoridori-midori --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
