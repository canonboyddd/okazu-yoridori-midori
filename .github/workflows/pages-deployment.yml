name: Fast Cloudflare Pages deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: cloudflare-pages-fast
  cancel-in-progress: true

jobs:
  fast-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Fast deploy without FANZA rebuild
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find latest production snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-data-deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "No successful daily production snapshot exists yet. Wait for the initial full refresh to finish."
            exit 1
          fi
          SNAPSHOT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '.head_sha')"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SNAPSHOT_SHA" >> "$GITHUB_OUTPUT"
          echo "Using production snapshot from run $RUN_ID at $SNAPSHOT_SHA"

      - name: Guard against unapplied heavy generator changes
        env:
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.sha }}
        run: |
          git diff --name-only "$SNAPSHOT_SHA" "$GITHUB_SHA" > /tmp/since-snapshot.txt
          cat /tmp/since-snapshot.txt
          if grep -Eq '^scripts/(build_fanza_api|build_large_taxonomy_directory|rebuild_actress_directory_balanced|build_full_catalog_upgrade|build_dmm_popular_actresses)\.py$' /tmp/since-snapshot.txt; then
            echo "Heavy FANZA generator changes exist after the latest production snapshot. The full data workflow must finish first."
            exit 1
          fi

      - name: Download latest production snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.snapshot.outputs.run_id }}
        run: |
          rm -rf snapshot
          mkdir snapshot
          gh run download "$RUN_ID" -n production-public -D snapshot

      - name: Restore snapshot and overlay repository public changes
        env:
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.sha }}
        run: |
          mv public repo-public
          mkdir public
          if [ -d snapshot/public ]; then
            cp -a snapshot/public/. public/
          else
            cp -a snapshot/. public/
          fi

          git diff --name-only "$SNAPSHOT_SHA" "$GITHUB_SHA" -- public/ > /tmp/public-changes.txt
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            rel="${path#public/}"
            src="repo-public/$rel"
            dst="public/$rel"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dst")"
              rm -rf "$dst"
              cp -a "$src" "$dst"
            else
              rm -rf "$dst"
            fi
          done < /tmp/public-changes.txt

      - name: Build instant product lookup
        run: python .github/workflows/helpers/build_catalog_lookup_index.py

      - name: Apply fast site transformations
        run: |
          python scripts/polish_actress_directory.py
          python scripts/move_ranking_pr_notice.py
          python scripts/fix_fanza_affiliate_links.py
          python scripts/enhance_fanza_seo.py
          python scripts/add_fc2_adult_section.py
          python scripts/inject_colorful_readability.py
          python scripts/apply_competitor_benchmark_upgrade.py
          python scripts/optimize_home_for_immediate_discovery.py
          python scripts/remove_internal_operator_copy.py

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=okazu-yoridori-midori --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
