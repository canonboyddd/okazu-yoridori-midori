name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check complete site archive
        id: site
        shell: bash
        run: |
          if [ -f site_parts/complete.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Site upload is not complete yet; deployment skipped."
          fi

      - name: Rebuild and verify site archive
        if: steps.site.outputs.ready == 'true'
        shell: bash
        run: |
          cat site_parts/part-* > site.zip.b64
          base64 --decode site.zip.b64 > site.zip
          EXPECTED_SHA="$(cat site_parts/complete.txt | tr -d '\r\n')"
          ACTUAL_SHA="$(sha256sum site.zip | awk '{print $1}')"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          rm -rf public
          mkdir -p public
          unzip -q site.zip -d public

      - name: Deploy
        if: steps.site.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=okazu-yoridori-midori --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
