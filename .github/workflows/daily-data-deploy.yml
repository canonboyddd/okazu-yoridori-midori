name: Daily FANZA data refresh

on:
  schedule:
    # 19:30 UTC = 04:30 JST (next day)
    - cron: "30 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-data-deploy.yml'
      - '.github/workflows/helpers/patch_full_catalog_comments.py'
      - '.github/workflows/helpers/enhance_product_descriptions.py'
      - '.github/workflows/helpers/shard_large_entity_catalogs.py'
      - 'config/actress_aliases.json'
      - 'scripts/validate_actress_alias_db.py'
      - 'scripts/merge_actress_aliases.py'
      - 'scripts/enhance_actress_alias_pages.py'
      - 'scripts/enhance_product_pages_v2.py'
      - 'scripts/enhance_entity_seo_v2.py'
      - 'scripts/run_home_optimizer_safe.py'
      - 'scripts/build_fanza_api.py'
      - 'scripts/build_large_taxonomy_directory.py'
      - 'scripts/rebuild_actress_directory_balanced.py'
      - 'scripts/build_full_catalog_upgrade.py'
      - 'scripts/build_dmm_popular_actresses.py'
      - 'scripts/enforce_cloudflare_pages_limit.py'
      - 'scripts/inject_colorful_readability.py'
      - 'scripts/optimize_sale_page.py'
      - 'scripts/fix_actress_catalog_index.py'
      - 'public/assets/rank-contrast-fix.css'

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: daily-fanza-data-refresh
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    name: Refresh FANZA data and deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand FANZA catalog settings
        run: |
          sed -i 's/^ENTITY_LIMIT = 10$/ENTITY_LIMIT = 20/' scripts/build_fanza_api.py
          sed -i 's/^ENTITY_HITS = 20$/ENTITY_HITS = 30/' scripts/build_fanza_api.py

      - name: Build FANZA ranking cache
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_API_AFFILIATE_ID: ${{ secrets.DMM_API_AFFILIATE_ID }}
        run: python scripts/build_fanza_api.py

      - name: Build large actress genre maker directories
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_API_AFFILIATE_ID: ${{ secrets.DMM_API_AFFILIATE_ID }}
        run: python scripts/build_large_taxonomy_directory.py

      - name: Rebuild actress search data across full 50-on
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_API_AFFILIATE_ID: ${{ secrets.DMM_API_AFFILIATE_ID }}
        run: python scripts/rebuild_actress_directory_balanced.py

      - name: Polish actress directory UI
        run: python scripts/polish_actress_directory.py

      - name: Enable full-catalog product comments
        run: python .github/workflows/helpers/patch_full_catalog_comments.py

      - name: Build full FANZA catalog actress profiles sale and search
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_API_AFFILIATE_ID: ${{ secrets.DMM_API_AFFILIATE_ID }}
          DMM_FULL_CATALOG_MAX_PAGES: "0"
          MAX_INDEXABLE_FILES: "10000"
        run: python scripts/build_full_catalog_upgrade.py

      - name: Build DMM popularity-first actress ranking and 50-on data
        env:
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_API_AFFILIATE_ID: ${{ secrets.DMM_API_AFFILIATE_ID }}
          DMM_POPULAR_ACTRESS_TARGET: "10000"
          DMM_POPULAR_ACTRESS_MAX_PAGES: "500"
          DMM_POPULAR_ACTRESS_ENRICH_MISSING: "300"
        run: python scripts/build_dmm_popular_actresses.py

      - name: Validate actress identity database
        run: python scripts/validate_actress_alias_db.py

      - name: Merge same actress across alternate names
        run: python scripts/merge_actress_aliases.py

      - name: Enhance actress profile pages
        run: python scripts/enhance_actress_alias_pages.py

      - name: Bust ranking asset caches
        run: |
          find public -type f -name '*.html' -exec sed -i \
            -e 's#entity-rankings.css?v=20260925-2200#entity-rankings.css?v=20260925-2315#g' \
            -e 's#entity-rankings.css?v=20260925-2252#entity-rankings.css?v=20260925-2315#g' {} +

      - name: Move ranking PR disclosure below products
        run: python scripts/move_ranking_pr_notice.py

      - name: Enhance generated ranking SEO
        run: python scripts/enhance_fanza_seo.py

      - name: Link homepage to ranking hubs
        run: python scripts/add_ranking_hub_links.py

      - name: Add FC2 Adult section and site-wide navigation
        run: python scripts/add_fc2_adult_section.py

      - name: Apply colorful readable theme
        run: python scripts/inject_colorful_readability.py

      - name: Apply competitor benchmark UX upgrade
        run: python scripts/apply_competitor_benchmark_upgrade.py

      - name: Optimize homepage for immediate discovery
        run: python scripts/run_home_optimizer_safe.py

      - name: Audit every public page and remove operator-only copy
        run: python scripts/remove_internal_operator_copy.py

      - name: Add product descriptions from FANZA comments
        run: python .github/workflows/helpers/enhance_product_descriptions.py

      - name: Add related works and stronger product conversion UX
        run: python scripts/enhance_product_pages_v2.py

      - name: Strengthen product and actress SEO metadata
        run: python scripts/enhance_entity_seo_v2.py

      - name: Compact heavy sale page
        env:
          SALE_STATIC_LIMIT: "120"
        run: python scripts/optimize_sale_page.py

      - name: Build instant product lookup
        run: python .github/workflows/helpers/build_catalog_lookup_index.py

      - name: Normalize actress catalog index key
        run: python scripts/fix_actress_catalog_index.py

      - name: Shard oversized entity catalogs for Cloudflare Pages
        run: python .github/workflows/helpers/shard_large_entity_catalogs.py

      - name: Refresh final theme and ranking badge styles
        run: python scripts/inject_colorful_readability.py

      - name: Enforce Cloudflare Pages file limit
        env:
          CLOUDFLARE_PAGES_TARGET_FILES: "19000"
          CLOUDFLARE_PROTECTED_PRODUCT_IDS: "1sods00082"
        run: python scripts/enforce_cloudflare_pages_limit.py

      - name: Verify production build before deploy
        run: |
          test -s public/data/full-catalog-manifest.json
          test -s public/data/actress-alias-groups.json
          test -s public/data/actress-profile-summary.json
          test -s public/data/actress-catalog-index.json
          test -s public/ranking/actress/aliases/index.html
          test -s public/assets/product-page-v2.css
          test -s public/assets/actress-profile-v2.css
          test -s public/assets/rank-contrast-fix.css
          python -c 'import json; d=json.load(open("public/data/actress-catalog-index.json", encoding="utf-8")); assert isinstance(d.get("actresses"), list) and d["actresses"]; assert "actresss" not in d'
          SALE_CARDS="$(grep -o 'class="fc-card"' public/sale/index.html | wc -l | tr -d ' ')"
          echo "Sale page visible cards: $SALE_CARDS"
          test "$SALE_CARDS" -le 120
          FILE_COUNT="$(find public -type f | wc -l | tr -d ' ')"
          echo "Production file count: $FILE_COUNT"
          if [ "$FILE_COUNT" -gt 20000 ]; then
            echo "Cloudflare Pages only supports up to 20,000 files."
            exit 1
          fi
          if grep -RIl --include='*.html' --include='*.json' --include='*.js' 'af_id=okazumidori-001.*ch=link_tool' public | head -n 1 | grep -q .; then
            echo 'Broken FANZA link_tool URL exists in production build.'
            exit 1
          fi

      - name: Save production snapshot for fast deploys
        uses: actions/upload-artifact@v4
        with:
          name: production-public
          path: public
          retention-days: 3
          compression-level: 1
          if-no-files-found: error

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=okazu-yoridori-midori --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
