name: Actress alias merge deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/actress-alias-deploy.yml'
      - 'config/actress_aliases.json'
      - 'scripts/validate_actress_alias_db.py'
      - 'scripts/merge_actress_aliases.py'
      - 'scripts/enhance_actress_alias_pages.py'
  workflow_run:
    workflows: ["Daily FANZA data refresh"]
    types: [completed]

permissions:
  contents: read
  actions: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  alias-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find latest successful production snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/daily-data-deploy.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "No successful production snapshot found."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using production snapshot run $RUN_ID"

      - name: Download production snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.snapshot.outputs.run_id }}
        run: |
          mkdir -p snapshot
          gh run download "$RUN_ID" -n production-public -D snapshot

      - name: Restore snapshot and overlay current runtime fixes
        run: |
          mv public repo-public
          mkdir public
          if [ -d snapshot/public ]; then
            cp -a snapshot/public/. public/
          else
            cp -a snapshot/. public/
          fi
          for rel in \
            _headers \
            assets/affiliate-config.js \
            assets/affiliate-compliance.js \
            assets/dynamic-product.js \
            assets/fanza-products.js \
            assets/fc2-adult.css \
            fc2-adult/index.html; do
            if [ -f "repo-public/$rel" ]; then
              mkdir -p "public/$(dirname "$rel")"
              cp -f "repo-public/$rel" "public/$rel"
            fi
          done

      - name: Preserve valid FANZA affiliate links
        run: python scripts/fix_fanza_affiliate_links.py

      - name: Validate actress identity database
        run: python scripts/validate_actress_alias_db.py

      - name: Merge same actress across alternate names
        run: python scripts/merge_actress_aliases.py

      - name: Enhance actress profile pages
        run: python scripts/enhance_actress_alias_pages.py

      - name: Verify alias output
        run: |
          test -s public/data/actress-identity-db.json
          test -s public/data/actress-alias-groups.json
          test -s public/data/actress-profile-summary.json
          test -s public/ranking/actress/aliases/index.html
          test -s public/assets/actress-profile-v2.css
          python - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path('config/actress_aliases.json').read_text(encoding='utf-8'))
          data = json.loads(Path('public/data/actress-alias-groups.json').read_text(encoding='utf-8'))
          summary = json.loads(Path('public/data/actress-profile-summary.json').read_text(encoding='utf-8'))
          if len(config.get('groups') or []) < 20:
              raise SystemExit('Alias identity database unexpectedly small')
          if not data.get('groups'):
              raise SystemExit('No resolved actress alias groups')
          if not summary.get('profiles'):
              raise SystemExit('No enhanced actress profiles')
          print('Configured identities:', len(config.get('groups') or []))
          print('Resolved identities:', len(data.get('groups') or []))
          print('Enhanced profiles:', len(summary.get('profiles') or []))
          print('Resolved alias groups:', [(g['canonical'], g['workCount']) for g in data['groups']])
          PY
          if grep -RIl --include='*.html' --include='*.json' --include='*.js' 'af_id=okazumidori-001.*ch=link_tool' public | head -n 1 | grep -q .; then
            echo 'Broken FANZA link_tool URL exists in alias deployment output.'
            exit 1
          fi

      - name: Deploy alias merge to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=okazu-yoridori-midori --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
