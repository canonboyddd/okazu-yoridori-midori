name: Fix public homepage copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-public-home-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply user-facing copy fix
        run: node scripts/fix-public-home-copy.mjs
      - name: Commit public copy
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git commit -m "Replace operator-only homepage copy"
          git push
